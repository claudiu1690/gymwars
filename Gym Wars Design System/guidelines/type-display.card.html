<!-- @dsCard group="Type" viewport="700x260" name="Display Type" subtitle="Archivo Black — fighter names, fight banner, dramatic numbers" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); font-family: var(--font-display); padding: 16px 20px; }
  .row { display: flex; flex-direction: column; gap: 2px; }
  .spec { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .spec:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); min-width: 80px; flex-shrink: 0; }
  .sample { color: var(--ink); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; }
  .label { font-family: var(--font-body); font-size: 10px; color: var(--ink-muted); margin-left: auto; flex-shrink: 0; }
</style>
<div class="row">
  <div class="spec">
    <span class="meta">72px</span>
    <span class="sample" style="font-size: 72px; letter-spacing: -0.02em;">FIGHT</span>
    <span class="label">Fight Night banner</span>
  </div>
  <div class="spec">
    <span class="meta">40px</span>
    <span class="sample" style="font-size: 40px; letter-spacing: -0.01em;">MARCUS VEGA</span>
    <span class="label">Fighter name — detail</span>
  </div>
  <div class="spec">
    <span class="meta">24px</span>
    <span class="sample" style="font-size: 24px;">MARCUS VEGA</span>
    <span class="label">Fighter name — card</span>
  </div>
  <div class="spec">
    <span class="meta">18px</span>
    <span class="sample" style="font-size: 18px;">LIGHTWEIGHT CHAMPIONSHIP</span>
    <span class="label">Section headings</span>
  </div>
  <div class="spec">
    <span class="meta">14px</span>
    <span class="sample" style="font-size: 14px;">GYM WARS — SEASON 3</span>
    <span class="label">Small display labels</span>
  </div>
</div>
