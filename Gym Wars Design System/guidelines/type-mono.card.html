<!-- @dsCard group="Type" viewport="700x200" name="Mono Type" subtitle="IBM Plex Mono — every stat, timer, record, and fight log line" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); font-family: var(--font-mono); padding: 16px 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .group { display: flex; flex-direction: column; gap: 4px; }
  .label { font-family: var(--font-body); font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; }
</style>
<div class="row">
  <div class="group">
    <span class="label">Stat value</span>
    <span style="font-size: 32px; font-weight: 600; color: var(--ink); letter-spacing: -0.02em;">76</span>
  </div>
  <div class="group">
    <span class="label">Record</span>
    <span style="font-size: 20px; font-weight: 500; color: var(--ink);">12<span style="color: var(--ink-muted)">–</span>3</span>
  </div>
  <div class="group">
    <span class="label">Timer — days</span>
    <span style="font-size: 20px; font-weight: 500; color: var(--ember);">3d 12h</span>
  </div>
  <div class="group">
    <span class="label">Timer — urgent</span>
    <span style="font-size: 20px; font-weight: 500; color: var(--corner-red);">0d 45m</span>
  </div>
  <div class="group">
    <span class="label">Purse</span>
    <span style="font-size: 20px; font-weight: 500; color: var(--win);">$4,200</span>
  </div>
</div>
<div class="row">
  <div class="group" style="flex: 1;">
    <span class="label">Fight log</span>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 12px; color: var(--ember);">R1 0:42 — VEGA lands a heavy leg kick. Martinez retreats.</span>
      <span style="font-size: 12px; color: var(--corner-red);">R1 1:15 — MARTINEZ shoots for a takedown. Vega defends.</span>
      <span style="font-size: 12px; color: var(--ink-muted);">R1 2:30 — Both fighters exchange jabs. No damage.</span>
    </div>
  </div>
</div>
